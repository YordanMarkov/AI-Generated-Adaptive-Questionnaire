name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Trigger Vercel production deployment
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Trigger deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [[ -z "$VERCEL_DEPLOY_HOOK_URL" ]]; then
            echo "::error::The VERCEL_DEPLOY_HOOK_URL repository secret is not configured."
            exit 1
          fi

          response="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --request POST \
              "$VERCEL_DEPLOY_HOOK_URL"
          )"

          job_id="$(jq -r '.job.id // empty' <<< "$response")"
          job_state="$(jq -r '.job.state // empty' <<< "$response")"

          if [[ -z "$job_id" ]]; then
            echo "::error::Vercel did not return a deployment job."
            echo "$response"
            exit 1
          fi

          echo "Vercel deployment queued: $job_id ($job_state)"
